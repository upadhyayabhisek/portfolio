<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h1 {
            font-size: 80px;
            font-weight: 600;
            color: #0a8fff;
            margin-top: 100px;
        }

        p {
            font-size: 20px;
            color: #bbb;
        }

        .btn {
            background-color: #0a8fff;
            color: #fff;
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
            text-decoration: none;
            /* Remove the underline */
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #0771e5;
        }
    </style>
</head>

<body>

    <h1>404</h1>
    <p>Sorry, the page you're looking for doesn't exist.</p>
    <a href="index.html" class="btn">Go Back Home</a>

</body>

</html>
