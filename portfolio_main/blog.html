<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/styles.css"> <!-- Main Styles -->
    <link rel="stylesheet" href="CSS/blog.css"> <!-- Blog Specific Styles -->
    <link rel="shortcut icon" href="assets/images/favicon.png" type="image/x-icon">
    <title>Blog | Abhisek Upadhyay</title>
</head>

<body>
    <div class="container">
        <nav id="header">
            <div class="nav-logo">
                <p class="nav-name">Abhisek Upadhyay</p>
            </div>
            <div class="nav-menu">
                <ul class="nav_menu_list">
                    <li class="nav_list">
                        <a href="index.html" class="nav-link">Home</a>
                    </li>
                </ul>
            </div>
        </nav>

        <main class="wrapper">
            <section class="blog-posts">
                <h1>My Thoughts!</h1>



                <div class="blog-post">
                    <h2>Not added yet!</h2>
                    <p class="post-date">June 4, 2025</p>
                    <p class="post-excerpt">
                        <span class="tldr">TLDR:</span> Not updated.
                    </p>
                    <a href="#!" class="read-more">Read More</a>
                    <div class="full-post">
                        <p>It hasnt been updated yet visit later!</p>
                    </div>
                </div>



            </section>
        </main>

        <!-- FOOTER -->
        <footer>

            <div class="bottom-footer">
                <p>&copy; <a href="blog.html" style="text-decoration: none;">Abhisek Upadhyay 2025</a> - All rights
                    reserved</p>
            </div>
        </footer>
    </div>

    <script>
        const readMoreLinks = document.querySelectorAll('.read-more');

        readMoreLinks.forEach(link => {
            link.addEventListener('click', function (e) {
                e.preventDefault();
                const fullPost = this.nextElementSibling;
                fullPost.style.display = fullPost.style.display === 'block' ? 'none' : 'block';
                this.textContent = fullPost.style.display === 'block' ? 'Read Less' : 'Read More';
            });
        });
    </script>
</body>

</html>
